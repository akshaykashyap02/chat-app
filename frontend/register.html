<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — Chat App</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-container">
    <div class="brand">✨</div>
    <h2>Create account</h2>
    <p class="subtitle" style="margin-bottom: 0;">
      Sign up with email, phone, or both.
    </p>

    <form id="registerForm" autocomplete="on">
      <div class="input-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="alice"
               required minlength="3" autocomplete="username">
      </div>

      <div class="input-group">
        <label for="email">Email (optional)</label>
        <input type="email" id="email" name="email"
               placeholder="you@example.com" autocomplete="email">
      </div>

      <div class="input-group">
        <label for="phone">Phone (optional)</label>
        <input type="text" id="phone" name="phone"
               placeholder="+919876543210" autocomplete="tel">
      </div>

      <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password"
               placeholder="At least 6 characters" required minlength="6"
               autocomplete="new-password">
      </div>

      <button type="submit" id="submitBtn">Create Account</button>
    </form>

    <p id="msg"></p>

    <div class="auth-footer">
      Already have an account? <a href="login.html">Sign in</a>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
