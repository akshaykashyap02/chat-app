<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Chat App</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- ============================
       NAVBAR
       ============================ -->
  <nav class="navbar">
    <a href="dashboard.html" class="nav-brand">
      <span class="nav-logo">💬</span>
      <span>Chat App</span>
    </a>

    <div class="nav-user">
      <div class="avatar" id="navAvatar">?</div>
      <span class="nav-username" id="navUsername">Loading...</span>
      <button class="nav-logout" onclick="logout()">Logout</button>
    </div>
  </nav>

  <!-- ============================
       DASHBOARD CONTENT
       ============================ -->
  <main class="dashboard">
    <!-- Welcome Card -->
    <div class="welcome-card">
      <div class="welcome-text">
        <h1 id="welcomeTitle">Hi there 👋</h1>
        <p class="subtitle" id="welcomeSubtitle">
          Welcome to your chat dashboard.
        </p>
      </div>
      <div class="welcome-emoji">💬</div>
    </div>

    <!-- Feature Grid -->
    <div class="stats-grid">
      <a href="chat.html" class="stat-card">
        <div class="stat-icon">💬</div>
        <h3>Chat</h3>
        <p>Start messaging</p>
      </a>

      <a href="profile.html" class="stat-card">
        <div class="stat-icon">👤</div>
        <h3>Profile</h3>
        <p>Edit your info</p>
      </a>

      <a href="admin.html" class="stat-card" id="adminCard" style="display: none;">
        <div class="stat-icon">👑</div>
        <h3>Admin</h3>
        <p>Manage users</p>
      </a>

      <a href="notifications.html" class="stat-card">
        <div class="stat-icon">🔔</div>
        <h3>Notifications</h3>
        <p>Recent activity</p>
      </a>
    </div>
  </main>

  <!-- Scripts (order matters!) -->
  <script src="js/config.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
