<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password — Chat App</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-container">
    <div class="brand">🔑</div>
    <h2>Forgot password</h2>
    <p class="subtitle" style="margin-bottom: 0;">
      Enter your email. We'll send you a 6-digit OTP.
    </p>

    <form id="forgotForm">
      <div class="input-group">
        <label for="identifier">Email</label>
        <input type="email" id="identifier" name="identifier"
               placeholder="you@example.com" required>
      </div>

      <button type="submit" id="submitBtn">Send OTP</button>
    </form>

    <p id="msg"></p>

    <div class="auth-footer">
      Remembered it? <a href="login.html">Back to sign in</a>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
