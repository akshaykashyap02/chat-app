<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — Chat App</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-container">
    <div class="brand">🔒</div>
    <h2>Reset password</h2>
    <p class="subtitle" style="margin-bottom: 0;">
      Enter the OTP from your email and choose a new password.
    </p>

    <form id="resetForm">
      <div class="input-group">
        <label for="identifier">Email</label>
        <input type="email" id="identifier" name="identifier"
               placeholder="you@example.com" required>
      </div>

      <div class="input-group">
        <label for="otp">6-digit OTP</label>
        <input type="text" id="otp" name="otp"
               placeholder="123456" required minlength="6" maxlength="6"
               pattern="[0-9]{6}" inputmode="numeric">
      </div>

      <div class="input-group">
        <label for="newPassword">New Password</label>
        <input type="password" id="newPassword" name="newPassword"
               placeholder="At least 6 characters" required minlength="6"
               autocomplete="new-password">
      </div>

      <button type="submit" id="submitBtn">Reset Password</button>
    </form>

    <p id="msg"></p>

    <div class="auth-footer">
      <a href="forgot-password.html">Request new OTP</a> ·
      <a href="login.html">Back to sign in</a>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
